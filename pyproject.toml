[tool.poetry]
name = "trading-research-platform"
version = "1.0.0"
description = "Autonomous Trading Research Platform with ML, Backtesting, and Real-time Data"
authors = ["Antony486"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = "^0.30.0"
websockets = "^13.0"
ccxt = "^4.4.0"
pandas = "^2.2.0"
numpy = "^1.26.0"
scikit-learn = "^1.5.0"
xgboost = "^2.1.0"
torch = "^2.4.0"
asyncpg = "^0.30.0"
redis = "^5.0.0"
sqlalchemy = "^2.0.0"
psycopg2-binary = "^2.9.0"
streamlit = "^1.38.0"
plotly = "^5.24.0"
python-dotenv = "^1.0.0"
pydantic = "^2.9.0"
httpx = "^0.27.0"
mlflow = "^2.15.0"
optuna = "^4.0.0"
shap = "^0.45.0"
joblib = "^1.4.0"
pyarrow = "^17.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^5.0.0"
black = "^24.0.0"
ruff = "^0.6.0"
mypy = "^1.11.0"
pre-commit = "^3.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
